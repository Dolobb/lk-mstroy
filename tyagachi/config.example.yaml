# ============================================================
# Transport Analytics Configuration (TEMPLATE)
# ============================================================
# Скопируйте этот файл как config.yaml и заполните токены.

# API настройки (TIS Online)
api:
  base_url: "https://tt.tis-online.com/tt/api/v3"
  token: "YOUR_PRIMARY_TOKEN_HERE"
  # Дополнительные токены для параллельных запросов (опционально)
  # Если rate-limit привязан к токену, это ускорит загрузку
  tokens:
    - "YOUR_TOKEN_1"
    - "YOUR_TOKEN_2"
    # ... добавьте нужное количество токенов
  format: "json"
  timeout: 10
  retry_count: 3

# Пути к файлам
paths:
  input:
    requests: "Data/raw/Requests_raw.json"
    pl: "Data/raw/PL_raw.json"
  output:
    intermediate: "Data/intermediate/"
    final: "Data/final/"
    logs: "Data/logs/"

# Настройки парсинга
parsing:
  # Если true - останавливаемся при отсутствии обязательных полей
  # Если false - логируем предупреждение и продолжаем
  fail_on_missing_fields: false

  # Логировать предупреждения о пропущенных полях
  log_warnings: true

# Настройки извлечения номера заявки
extraction:
  # Регулярное выражение для извлечения (не используется напрямую,
  # но документирует логику)
  pattern_description: "Цифры от начала строки до '/' или пробела"

  # Игнорировать суффикс /1, /2 и т.д.
  ignore_suffix: true

# Настройки логирования
logging:
  # Уровень: DEBUG, INFO, WARNING, ERROR
  level: "INFO"

  # Выводить в консоль (false = только в файл, чище вывод)
  console: false

  # Сохранять в файл
  file: true

  # Формат файла лога
  file_format: "pipeline_{date}.log"
