<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>

  .it{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--card-border)}
  .it svg{width:62px;height:36px}
  .it .n{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--fg-2)}
</style></head><body data-theme="dark">
<div class="grid">

  </div>
  <div class="it">

      <rect x="16" y="14" width="20" height="12" rx="2"/><path d="M36 16 L48 6 L54 12 L60 22 L56 24 L52 18 Z"/>
    </svg>

  </div>

      <circle cx="14" cy="28" r="9"/><circle cx="14" cy="28" r="5" stroke-width="1.1"/>
      <rect x="24" y="16" width="26" height="14" rx="2"/><rect x="30" y="8" width="14" height="10" rx="2"/>

      <line x1="32" y1="24" x2="32" y2="6"/><line x1="32" y1="6" x2="58" y2="14"/><line x1="50" y1="11" x2="50" y2="22"/>
    </svg>

  </div>
</div>
</body></html>
