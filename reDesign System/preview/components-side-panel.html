<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:14px;font-family:var(--font-sans);background:var(--bg-gradient);color:var(--fg-1);height:100%;box-sizing:border-box}
  .side{display:flex;flex-direction:column;gap:10px}
  .week{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--divider)}
  .week .arr{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:var(--fg-3);font-size:14px}
  .week .t{font-size:12px;font-weight:700;text-align:center}
  .week .s{font-size:9px;color:var(--fg-3);text-align:center}
  .obj{padding-top:6px}
  .obj .h{display:flex;align-items:center;gap:6px}
  .obj .dot{width:9px;height:9px;border-radius:50%}
  .obj .n{font-size:12px;font-weight:700;flex:1}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
  .mk{background:var(--card-inner);border:1px solid var(--card-inner-border);border-radius:8px;padding:5px 7px}
  .mk .l{font-size:7px;font-weight:700;text-transform:uppercase;color:var(--fg-3);letter-spacing:.4px}
  .mk .v{font-size:15px;font-weight:800;color:var(--fg-1);margin-top:1px;font-variant-numeric:tabular-nums;line-height:1}
</style></head><body data-theme="dark">
<div class="side">
  <div class="week">
    <button class="arr">‹</button>
    <div><div class="t">30.04 — 12.05.2026</div><div class="s">13 дней · 8 объектов</div></div>
    <button class="arr">›</button>
  </div>
  <div class="obj">
    <div class="h"><span class="dot" style="background:#22C55E"></span><span class="n">Екатеринбург</span><span style="color:#22C55E;font-weight:800;font-size:12px">95%</span></div>
    <div class="kpi"><div class="mk"><div class="l">ТС</div><div class="v">13</div></div><div class="mk"><div class="l">Рейсы</div><div class="v">1 496</div></div></div>
  </div>
  <div class="obj" style="border-top:1px solid var(--divider);padding-top:8px">
    <div class="h"><span class="dot" style="background:#EF4444"></span><span class="n">СМУ Белогорск</span><span style="color:#EF4444;font-weight:800;font-size:12px">42%</span></div>
    <div class="kpi"><div class="mk"><div class="l">ТС</div><div class="v">18</div></div><div class="mk"><div class="l">Рейсы</div><div class="v">14 074</div></div></div>
  </div>
</div>
</body></html>
