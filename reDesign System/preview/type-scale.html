<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--bg-gradient);color:var(--fg-1);height:100%;box-sizing:border-box}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .row{padding:10px 12px;border-radius:8px;background:var(--card);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--fg-3);min-width:80px}
  .v{flex:1}
</style></head><body data-theme="dark">
<div class="grid">
  <div class="row"><span class="l">metric-xl</span><span class="t-metric-xl v">1 805</span></div>
  <div class="row"><span class="l">metric-l</span><span class="t-metric-l v">14 074 л</span></div>
  <div class="row"><span class="l">h2</span><span class="t-h2 v">Аналитика</span></div>
  <div class="row"><span class="l">h3</span><span class="t-h3 v">Самосвалы</span></div>
  <div class="row"><span class="l">h4</span><span class="t-h4 v">P322TH196</span></div>
  <div class="row"><span class="l">body</span><span class="t-body v">HINO 600/Bell B40</span></div>
  <div class="row"><span class="l">body-sm</span><span class="t-body-sm v">МО-36 · слежка по месту</span></div>
  <div class="row"><span class="l">eyebrow</span><span class="t-eyebrow v">СМЕНЫ / РЕЙСЫ</span></div>
  <div class="row"><span class="l">label</span><span class="t-label v">ДВИГ. ИТОГО</span></div>
  <div class="row"><span class="l">table</span><span class="t-table v">257:36</span></div>
</div>
</body></html>
