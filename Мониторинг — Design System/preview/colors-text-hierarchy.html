<!doctype html>
<!-- @dsCard group="Colors" name="Text hierarchy" subtitle="4 уровня — text-1..text-4" viewport="700x200" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--bg-gradient);color:var(--fg-1);height:100%;box-sizing:border-box}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .lvl{padding:6px 10px;border-radius:8px;background:var(--card-inner);border:1px solid var(--card-inner-border);display:flex;align-items:baseline;justify-content:space-between}
  .lvl .n{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .lvl .h{font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
  .preview{padding:10px 12px;border-radius:8px;background:var(--card);border:1px solid var(--card-border);margin-top:12px}
</style></head><body data-theme="dark">
<div class="grid">
  <div class="lvl"><span class="n" style="color:#F1F5F9">text-1</span><span class="h">#F1F5F9</span></div>
  <div class="lvl"><span class="n" style="color:#94A3B8">text-2</span><span class="h">#94A3B8</span></div>
  <div class="lvl"><span class="n" style="color:#64748B">text-3</span><span class="h">#64748B</span></div>
  <div class="lvl"><span class="n" style="color:#475569">text-4</span><span class="h">#475569</span></div>
</div>
<div class="preview">
  <div style="color:#F1F5F9;font-weight:700">P322TH196 — заголовок</div>
  <div style="color:#94A3B8;font-size:12px">HINO 600/Bell B40 — модель</div>
  <div style="color:#64748B;font-size:11px;margin-top:4px">МО-36 · 23 смены · КИП 93%</div>
  <div style="color:#475569;font-size:9px;text-transform:uppercase;letter-spacing:.5px;margin-top:6px">ОБНОВЛЕНО 12.05.2026</div>
</div>
</body></html>
