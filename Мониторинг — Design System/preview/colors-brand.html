<!doctype html>
<!-- @dsCard group="Colors" name="Brand colors" subtitle="Primary, secondary, accent, semantic" viewport="700x140" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:18px;font-family:var(--font-sans);background:var(--bg-gradient);color:var(--fg-1);height:100%;box-sizing:border-box}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .sw{border-radius:10px;border:1px solid var(--card-border);height:78px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-shadow:var(--shadow-card)}
  .sw .n{font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);text-transform:uppercase;letter-spacing:.4px}
  .sw .h{font-size:9px;color:rgba(255,255,255,.7);font-family:var(--font-mono);text-shadow:0 1px 2px rgba(0,0,0,.6)}
</style></head>
<body data-theme="dark">
<div class="row">
  <div class="sw" style="background:#F97316"><div class="n">primary</div><div class="h">#F97316</div></div>
  <div class="sw" style="background:#3B82F6"><div class="n">secondary</div><div class="h">#3B82F6</div></div>
  <div class="sw" style="background:#22C55E"><div class="n">accent</div><div class="h">#22C55E</div></div>
  <div class="sw" style="background:#A78BFA"><div class="n">violet</div><div class="h">#A78BFA</div></div>
  <div class="sw" style="background:#F59E0B"><div class="n">amber</div><div class="h">#F59E0B</div></div>
  <div class="sw" style="background:#EF4444"><div class="n">danger</div><div class="h">#EF4444</div></div>
  <div class="sw" style="background:#60A5FA"><div class="n">info</div><div class="h">#60A5FA</div></div>
  <div class="sw" style="background:#8B5CF6"><div class="n">violet-d</div><div class="h">#8B5CF6</div></div>
</div></body></html>
